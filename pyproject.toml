[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milliecomplex-rsi"
version = "0.1.0"
description = "Reproducible, evidence-gated recursive strategy improvement research harness"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Matthew Chenoweth Wright"}]
keywords = ["recursive-self-improvement", "verification", "AI-assurance", "evidence"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]
