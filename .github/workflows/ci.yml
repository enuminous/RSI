name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Replay packaged demonstrator
        run: |
          python -m rsi verify examples/frozen_demo
          python -m rsi replay examples/frozen_demo
      - name: Fresh synthetic execution and replay
        run: |
          python -m rsi run --out runs/ci
          python -m rsi verify runs/ci --check-source
          python -m rsi replay runs/ci
